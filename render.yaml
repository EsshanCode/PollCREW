# Render blueprint for the Snug API (stateless rules engine + optional vision point finder).
services:
  - type: web
    name: pollcrew-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
